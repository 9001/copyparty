<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<title>{{ s_doctitle }}</title>
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=0.8">
	<meta name="theme-color" content="#{{ tcolor }}">
	<style>
		html {color: #ccc;background: #333;font-family: sans-serif;font-family: sans-serif, sans-serif;text-shadow: 1px 1px 0px #000;touch-action: manipulation;}
		html, body {margin: 0;padding: 0;}
		#box {padding: .5em 1em;background: #2c2c2c;}
		pre {font-family: monospace, monospace;font-family: 'scp', monospace, monospace;}
		a {color: #fc5;}
	</style>
{{ html_head }}
</head>

<body>
	<div id="box">

		{%- if h1 %}
		<h1>{{ h1 }}</h1>
		{%- endif %}

		{%- if h2 %}
		<h2>{{ h2 }}</h2>
		{%- endif %}

		{%- if p %}
		<p>{{ p }}</p>
		{%- endif %}

		{%- if pre %}
		<pre>{{ pre }}</pre>
		{%- endif %}

		{%- if html %}
		{{ html }}
		{%- endif %}

		{%- if click %}
		<script>document.getElementsByTagName("a")[0].click()</script>
		{%- endif %}
	</div>

	{%- if redir %}
	<script>
		setTimeout(function() {
			location.replace("{{ redir }}");
		}, 600);
	</script>
	{%- endif %}
	{%- if js %}
	<script src="{{ js }}_={{ ts }}"></script>
	{%- endif %}
</body>

</html>
